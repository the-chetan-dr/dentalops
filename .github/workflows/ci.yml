
name: Dental Clinic CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dental-clinic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-24.04

    env:
      SECRET_KEY: ci-only-secret-key-for-github-actions-testing-2026-unique-value-123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SETTINGS_MODULE: dental_clinic.settings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Compile Python files
        run: |
          python -m compileall -q accounts aiassistant clinic dental_clinic manage_panel pages

      - name: Lint project code
        run: |
          ruff check accounts aiassistant clinic dental_clinic manage_panel pages --select E9,F63,F7,F82 --output-format=github

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated tests
        run: python manage.py test --verbosity 2

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Django production security checks
        run: python manage.py check --deploy

  security:
    name: Dependency and source security scans
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
          pip install -r requirements.txt

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Scan Python code with Bandit
        run: |
          bandit -r accounts aiassistant clinic dental_clinic manage_panel pages -ll -ii

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
